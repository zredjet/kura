[workspace]
resolver = "3"
members = ["crates/kura-core", "crates/kura-engine", "crates/kura-mac", "crates/kura-devtools", "crates/vorbis-tables", "src-tauri"]
# 第三者のクレートの写し（[patch.crates-io] で差し替える）。ワークスペースの lint・整形・テストの対象にしない
exclude = [
    "third_party/symphonia-codec-aac",
    "third_party/symphonia-codec-vorbis",
    "third_party/symphonia-core",
    "third_party/symphonia-format-ogg",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/zredjet/kura"

[workspace.dependencies]
kura-core = { path = "crates/kura-core" }
kura-engine = { path = "crates/kura-engine" }
kura-mac = { path = "crates/kura-mac" }
# aoTuV の Vorbis のエンコーダの表（BSD-3-Clause。第三者のライセンスの一覧に、移植の kura-engine と同じ節で載る）
vorbis-tables = { path = "crates/vorbis-tables" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip：小数を正しく丸めて読む。既定の速い読み方は 1 ULP ずれることがあり、保存した編集の文書を読み直すと引数が変わる（ADR-136）
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# backup：DB の定期バックアップ（FR-SYS-03。SQLite の backup API）
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
blake3 = { version = "1.8", features = ["rayon"] }
rayon = "1.12"
reflink-copy = "0.1"
# jwalk は開発終了のため walkdir を使う（docs/decisions.md）
walkdir = "2.5"
unicode-normalization = "0.1"
# ダウンロードの規則（URL の正規表現。docs/decisions.md）
regex = "1.13"
# キャプチャ：Chrome の DevTools（127.0.0.1 の WebSocket）と、撮影結果の base64 を PNG に戻す（docs/decisions.md）
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = "0.22"
tempfile = "3"
rand_chacha = "0.10"
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
# 編集のエンジンの超越関数（OS の libm に頼らない。arch を外して CPU の命令にも頼らない。ADR-136・138）
libm = { version = "=0.2.16", default-features = false }
# 性質テスト（dev のみ）
proptest = "1.12"

tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
# ログイン用の Chrome を見ながら撮るキー（⌃⌥⌘C。出たばかりの版は避けて固定する。docs/decisions.md）
tauri-plugin-global-shortcut = "=2.4.0"
# tauri-specta はまだ RC のため版を固定する（ADR-16）
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
swift-rs = "1.0.9"

[workspace.lints.clippy]
# 本番コードで unwrap / expect / panic / println を使わない（テストは clippy.toml で許可）
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# symphonia 0.6.1 の写し（どれも third_party/<クレート>/KURA.md に変更と理由）。fuzz/Cargo.toml にも同じものを書く
# - symphonia-codec-vorbis：residue 0/1 を 2 チャンネル以上で使うとき、次のチャンネルの分類を上書きする不具合の 1 行の
#   修正（ADR-149。上流が直した版を出したら、この修正は外す）と、下の超越関数の差し替え
# - symphonia-core（MDCT・FFT の表）・symphonia-codec-aac（窓・TNS・逆量子化・スケールファクターの表）・
#   symphonia-codec-vorbis（窓・floor 0・codebook）：OS の libm の超越関数を libm クレート（kura-engine と同じ =0.2.16）に
#   差し替え、Vorbis・AAC の読み取りの値をどの環境でも同じにする（再現できるデコーダにしてアンカーを作らない。段 9 の D2）
# - symphonia-format-ogg・symphonia-codec-vorbis：lookup1_values を powf でなく整数で求める（OS・CPU で panic する組が違った）
[patch.crates-io]
symphonia-codec-aac = { path = "third_party/symphonia-codec-aac" }
symphonia-codec-vorbis = { path = "third_party/symphonia-codec-vorbis" }
symphonia-core = { path = "third_party/symphonia-core" }
symphonia-format-ogg = { path = "third_party/symphonia-format-ogg" }
