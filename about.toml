# 配布する .app に入る Rust の依存のライセンス。`pnpm run licenses` が THIRD_PARTY_LICENSES.md を作るときに使う。
# 二重ライセンスの依存は、この並びの先にあるものを選ぶ。ここにない（コピーレフトの強い）ライセンスの依存が入ると生成が失敗する。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "IJG",
    "MPL-2.0",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# libm（kura-engine の超越関数）：LICENSE.txt は MIT と Apache-2.0 の本文に、著作権の表示（Jorge Aparicio、musl の
# Rich Felker ほか、musl の数学の部分の Sun Microsystems ほか）を足した 1 つのファイルで、cargo-about はこれを MIT の本文と
# 認められず、著作権者の欄が空の雛形（`Copyright (c) <year> <copyright holders>`）を載せてしまう。MIT の許諾の本文と著作権の表示の
# 2 か所を切り出して載せる（一覧には libm の MIT の節が 2 つ並ぶ）。checksum は切り出した範囲（start の始まりから end の
# 終わりまで）の SHA-256。libm の版を上げて LICENSE.txt が変わると cargo-about は警告だけで雛形に戻すので、
# scripts/third-party-licenses.mjs がそれを止める。kura-engine が .app に入るまでは libm が依存のグラフになく、
# cargo-about が「config found for a crate not present in the graph」と警告する（害はない）。
[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
start = "rust-lang/libm as a whole is available for use under the MIT license:"
end = "SOFTWARE."
checksum = "88abfa952aa119ec3671f35fa0dc52589721f7f93982bd90f9649528f8fd74f8"

[[libm.clarify.files]]
path = "LICENSE.txt"
start = "This Rust library contains the following copyrights:"
end = "Copyright notices are retained in src/* files where relevant."
checksum = "cbdcdbb2c9a9da2ebdebfc9d0ef3349bac1cc4ddd78b7256a8150e515e52b5b8"

# 以下は、パッケージに本文があるのに cargo-about が拾えず、雛形を載せていたクレート（ADR-151）。checksum はファイル全体の
# SHA-256。cargo-about は名前が ripgrep の既定のファイルの型（license の型なら `LICENSE-*`・`LICENSE.*` など）に合う
# ファイルだけを読むので、`LICENSE_MIT`・`LICENSE_A2` のように `_` でつないだ名前は読まない。

# tauri のプラグイン：`Apache-2.0 OR MIT` の MIT の本文が LICENSE_MIT（読まれない名前）にある。
[tauri-plugin-dialog.clarify]
license = "Apache-2.0 OR MIT"

[[tauri-plugin-dialog.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607"

[tauri-plugin-fs.clarify]
license = "Apache-2.0 OR MIT"

[[tauri-plugin-fs.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607"

[tauri-plugin-global-shortcut.clarify]
license = "Apache-2.0 OR MIT"

[[tauri-plugin-global-shortcut.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607"

# blake3：選ぶ Apache-2.0 の本文が LICENSE_A2（読まれない名前）にある。
[blake3.clarify]
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"

[[blake3.clarify.files]]
path = "LICENSE_A2"
license = "Apache-2.0"
checksum = "00fcc7a934ddbc9ece2a7cc063ac788e284b703b1d705ccbba72d462aa97921e"

# constant_time_eq：LICENSE-APACHE は読まれるが、付録のない Apache-2.0 の本文で、Apache-2.0 と判定されない。
[constant_time_eq.clarify]
license = "CC0-1.0 OR MIT-0 OR Apache-2.0"

[[constant_time_eq.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a"

# dpi：`Apache-2.0 AND MIT` の MIT（libm から移した部分）の本文と著作権表示が LICENSE-LIBM-MIT にあるが、前置きと
# 著作権の表示の段があるので MIT と判定されない（確からしさ 0.76）。Apache-2.0 の LICENSE と一緒に指定する。
[dpi.clarify]
license = "Apache-2.0 AND MIT"

[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"

[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"

# 以下の 2 つは、`accepted` で先にある選択肢（MIT・Apache-2.0）の本文がパッケージにも上流のリポジトリ（公開した
# コミット）にもなく、ほかの選択肢の本文だけがある。本文のある選択肢を選ぶ（OR なので受け手が選べる）。
# brotli-decompressor（`BSD-3-Clause/MIT`）：Dropbox の BSD-3-Clause の LICENSE だけがある。
[brotli-decompressor.clarify]
license = "BSD-3-Clause"

[[brotli-decompressor.clarify.files]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

# dunce（`CC0-1.0 OR MIT-0 OR Apache-2.0`）：CC0-1.0 の LICENSE だけがある。
[dunce.clarify]
license = "CC0-1.0"

[[dunce.clarify.files]]
path = "LICENSE"
checksum = "a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499"
