# kura-engine のファズの対象（cargo-fuzz。nightly で回す）。docs/editing.md §13、fuzz/README.md。
# ルートのワークスペースには入れない（nightly の依存を通常のビルドに混ぜない）。
[package]
name = "kura-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kura-engine = { path = "../crates/kura-engine" }

[workspace]

[[bin]]
name = "decode_png"
path = "fuzz_targets/decode_png.rs"
test = false
doc = false
bench = false

