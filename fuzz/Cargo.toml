# kura-engine のファズの対象（cargo-fuzz。nightly で回す）。docs/editing.md §13、fuzz/README.md。
# ルートのワークスペースには入れない（nightly の依存を通常のビルドに混ぜない）。
[package]
name = "kura-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kura-engine = { path = "../crates/kura-engine" }

[workspace]

# ルートのワークスペースと同じ差し替え（symphonia 0.6.1 の写し：Vorbis の 3 ch 以上の不具合の修正、Vorbis・AAC の
# 超越関数の libm への差し替え、lookup1_values の整数化。third_party/<クレート>/KURA.md）。ここは別のワークスペース
# なので、ルートの [patch] が届かない
[patch.crates-io]
symphonia-codec-aac = { path = "../third_party/symphonia-codec-aac" }
symphonia-codec-vorbis = { path = "../third_party/symphonia-codec-vorbis" }
symphonia-core = { path = "../third_party/symphonia-core" }
symphonia-format-ogg = { path = "../third_party/symphonia-format-ogg" }

[[bin]]
name = "decode_png"
path = "fuzz_targets/decode_png.rs"
test = false
doc = false
bench = false

