<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索パレット</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 960px; background: #121214; color: #F4F4F6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <dc-import name="Main" accent="{{accent}}" hint-size="100%,960px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6, 6, 8, 0.58)"></div>

  <div role="dialog" aria-label="検索とフィルタ" style="position: absolute; top: 96px; left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); box-sizing: border-box; border-radius: 20px; background: rgba(40, 40, 46, 0.94); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); backdrop-filter: blur(32px) saturate(160%); -webkit-backdrop-filter: blur(32px) saturate(160%); overflow: hidden">

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 58px; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4B4BC" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="margin-right: 4px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

      <span style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 9px; box-sizing: border-box; border-radius: 8px; background: rgba(255, 255, 255, 0.10); font-size: 13px">
        夕景
        <button type="button" aria-label="条件「夕景」を外す" style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 4px 0 9px; box-sizing: border-box; border-radius: 8px; background: rgba(255, 255, 255, 0.10); font-size: 13px">
        <span style="color: #A9A9B2">種類</span>画像 または 動画
        <button type="button" aria-label="種類の条件を外す" style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 4px 0 9px; box-sizing: border-box; border-radius: 8px; border: 1px dashed rgba(255, 255, 255, 0.32); font-size: 13px">
        <span style="color: #A9A9B2">除外</span>未整理
        <button type="button" aria-label="除外条件「未整理」を外す" style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <input type="text" aria-label="検索条件を入力" value="作者:も" style="flex: 1; min-width: 120px; height: 28px; border: 0; outline: 0; background: transparent; color: #F4F4F6; font: inherit; font-size: 15px">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px 6px; font-size: 12px; color: #B4B4BC">
      <span>一致 <strong style="color: #F4F4F6; font-weight: 600">186</strong> 項目 — 画像 142 · 動画 44</span>
      <span style="color: #A3A3AC">入力中の候補</span>
    </div>

    <div style="display: flex; flex-direction: column; padding: 2px 8px 8px">
      <div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; color: #A3A3AC">タグ候補</div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.10); color: #F4F4F6; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>
        <span style="flex: 1; min-width: 0"><span style="color: #A9A9B2">作者:</span><strong style="font-weight: 700">も</strong>りの</span>
        <span style="font-size: 12px; color: #B4B4BC; font-variant-numeric: tabular-nums">312</span>
        <kbd style="font-family: inherit; font-size: 11px; color: #D9D9DE; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18)">↵</kbd>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E4E4E8; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3AC" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>
        <span style="flex: 1; min-width: 0"><span style="color: #A9A9B2">作者:</span>森野アトリエ</span>
        <span style="font-size: 12px; color: #B4B4BC; font-variant-numeric: tabular-nums">28</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E4E4E8; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3AC" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>
        <span style="flex: 1; min-width: 0"><span style="color: #A9A9B2">作者:</span><strong style="font-weight: 700">も</strong>もいろ工房</span>
        <span style="font-size: 12px; color: #B4B4BC; font-variant-numeric: tabular-nums">9</span>
      </button>

      <div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; color: #A3A3AC">保存済みの検索</div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: 10px; background: transparent; color: #E4E4E8; font: inherit; text-align: left; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3AC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px">夜景の背景資料</span>
          <span style="font-size: 11px; color: #A9A9B2; font-family: 'SF Mono', ui-monospace, Menlo, monospace">夜景 種類:画像 評価&gt;=3 -未整理</span>
        </span>
        <span style="font-size: 12px; color: #B4B4BC">スマートフォルダ</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: 10px; background: transparent; color: #E4E4E8; font: inherit; text-align: left; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3AC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px">未再生の長尺動画</span>
          <span style="font-size: 11px; color: #A9A9B2; font-family: 'SF Mono', ui-monospace, Menlo, monospace">種類:動画 長さ&gt;20分 再生回数:0</span>
        </span>
        <span style="font-size: 12px; color: #B4B4BC">スマートフォルダ</span>
      </button>

      <div style="padding: 12px 10px 6px; font-size: 11px; font-weight: 600; color: #A3A3AC">書き方</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 6px">
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">-夕景</code>除外</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">海 | 港</code>いずれか</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">長さ&gt;3分</code>比較</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">評価&gt;=4</code>評価</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">追加:7日以内</code>期間</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: 12px; color: #B4B4BC"><code style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; color: #F4F4F6">取得元:pixiv</code>サイト</span>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 12px 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(0, 0, 0, 0.16); font-size: 12px; color: #B4B4BC">
      <span style="display: flex; align-items: center; gap: 6px"><kbd style="font-family: inherit; font-size: 11px; color: #E4E4E8; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18)">↵</kbd>絞り込む</span>
      <span style="display: flex; align-items: center; gap: 6px"><kbd style="font-family: inherit; font-size: 11px; color: #E4E4E8; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18)">⌘↵</kbd>スマートフォルダとして保存</span>
      <span style="display: flex; align-items: center; gap: 6px"><kbd style="font-family: inherit; font-size: 11px; color: #E4E4E8; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18)">⇧↵</kbd>結果をランダム再生</span>
      <span style="display: flex; align-items: center; gap: 6px; margin-left: auto"><kbd style="font-family: inherit; font-size: 11px; color: #E4E4E8; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18)">esc</kbd>閉じる</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A45","options":["#FF7A45","#5AA9FF","#B48CFF","#F2C14E"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF7A45' };
  }
}
</script>
</body>
</html>
