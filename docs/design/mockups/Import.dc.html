<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>取り込みシート</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 960px; background: #121214; color: #F4F4F6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <dc-import name="Main" accent="{{accent}}" hint-size="100%,960px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6, 6, 8, 0.55)"></div>

  <div role="dialog" aria-label="ファイルの取り込み" style="position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); box-sizing: border-box; padding: 22px 22px 18px; border-radius: 22px; background: rgba(40, 40, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); backdrop-filter: blur(32px) saturate(160%); -webkit-backdrop-filter: blur(32px) saturate(160%); display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: {{accent}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"></path><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">128 項目を取り込み</h2>
        <span style="font-size: 12px; color: #C2C2CA">旅行2026 ほか 2 フォルダ · サブフォルダ 6</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #A9A9B2">画像</span>
        <span style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">96</span>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #A9A9B2">動画</span>
        <span style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">24</span>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #A9A9B2">音楽</span>
        <span style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">8</span>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #A9A9B2">合計</span>
        <span style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">18.4 GB</span>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
      <span style="flex: 1 1 260px; font-size: 13px; color: #EDEDF0">6 項目はすでにライブラリにあります（内容が同一）</span>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 8px; background: rgba(255, 255, 255, 0.07); color: #F4F4F6; font: inherit; font-size: 13px; cursor: pointer">スキップ<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h3 style="margin: 0 0 6px; font-size: 11px; font-weight: 600; color: #A9A9B2">整理</h3>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; font-size: 13px">
        取り込み先のフォルダ
        <button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 8px; background: rgba(255, 255, 255, 0.07); color: #F4F4F6; font: inherit; font-size: 13px; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="rgba(111,177,255,0.18)" stroke="#6FB1FF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          写真 / 2026 旅行
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>

      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.06)">
        <span style="display: flex; flex-direction: column; gap: 2px">
          フォルダ構成を仮想フォルダとして再現
          <span style="font-size: 11px; color: #A9A9B2">旅行2026 / 鎌倉 → 写真 / 2026 旅行 / 鎌倉</span>
        </span>
        <span style="position: relative; display: flex; flex: none; width: 34px; height: 20px; border-radius: 10px; background: {{accent}}">
          <input type="checkbox" checked aria-label="フォルダ構成を仮想フォルダとして再現" style="position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer">
          <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span>
        </span>
      </label>

      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.06)">
        <span style="display: flex; flex-direction: column; gap: 2px">
          フォルダ名をタグとして付ける
          <span style="font-size: 11px; color: #A9A9B2">鎌倉 → タグ「鎌倉」</span>
        </span>
        <span style="position: relative; display: flex; flex: none; width: 34px; height: 20px; border-radius: 10px; background: rgba(255, 255, 255, 0.18)">
          <input type="checkbox" aria-label="フォルダ名をタグとして付ける" style="position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer">
          <span aria-hidden="true" style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #D9D9DE"></span>
        </span>
      </label>

      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.06)">
        <span style="display: flex; flex-direction: column; gap: 2px">
          ファイルの情報からタグを付ける
          <span style="font-size: 11px; color: #A9A9B2">撮影地・撮影日（写真）、アーティスト・アルバム（音楽）</span>
        </span>
        <span style="position: relative; display: flex; flex: none; width: 34px; height: 20px; border-radius: 10px; background: {{accent}}">
          <input type="checkbox" checked aria-label="ファイルの情報からタグを付ける" style="position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer">
          <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span>
        </span>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; color: #A9A9B2">すべてに付けるタグ</h3>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 38px; box-sizing: border-box; padding: 4px 6px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.10); background: rgba(0, 0, 0, 0.22)">
        <span style="display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 8px; box-sizing: border-box; border-radius: 6px; background: rgba(255, 255, 255, 0.10); font-size: 12px">旅行<button type="button" aria-label="タグ「旅行」を外す" style="display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 0; border-radius: 4px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
        <span style="display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 8px; box-sizing: border-box; border-radius: 6px; background: rgba(255, 255, 255, 0.10); font-size: 12px">2026<button type="button" aria-label="タグ「2026」を外す" style="display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 0; border-radius: 4px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
        <input type="text" aria-label="すべてに付けるタグを追加" placeholder="タグを追加…" style="flex: 1; min-width: 120px; height: 26px; border: 0; outline: 0; background: transparent; color: #F4F4F6; font: inherit; font-size: 12px">
      </div>
    </div>

    <p style="margin: 0; display: flex; gap: 8px; font-size: 12px; line-height: 1.55; color: #B4B4BC">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      元のファイルは変更しません。ライブラリ内にコピーを作ります。同じディスク上では APFS のクローンを使うので、容量はほとんど増えません。
    </p>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding-top: 2px">
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.07); color: #F4F4F6; font-size: 13px; text-decoration: none">キャンセル</a>
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 34px; padding: 0 18px; border-radius: 17px; background: {{accent}}; color: #1C0E07; font-size: 13px; font-weight: 600; text-decoration: none">122 項目を取り込む</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A45","options":["#FF7A45","#5AA9FF","#B48CFF","#F2C14E"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF7A45' };
  }
}
</script>
</body>
</html>
