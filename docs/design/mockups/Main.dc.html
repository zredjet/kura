<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ライブラリ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 960px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; background: #121214; color: #F4F4F6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', sans-serif">

  <div style="flex: 1 1 248px; min-width: 0; display: block">
    <dc-import name="Sidebar" active="all" accent="{{accent}}" hint-size="100%,944px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 4px 6px 12px; min-height: 52px">
      <div style="display: flex; flex-direction: column; gap: 1px; margin-right: auto">
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">すべて</h1>
        <span style="font-size: 12px; color: #A3A3AC">12,480 項目 · 追加日の新しい順</span>
      </div>

      <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; flex: 0 1 320px; min-width: 200px; box-sizing: border-box; border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.08); color: #A9A9B2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" aria-label="ライブラリを検索" placeholder="タグ・名前・URLで検索" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #F4F4F6; font: inherit; font-size: 13px">
        <kbd style="font-family: inherit; font-size: 11px; color: #A9A9B2; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.05)">⌘K</kbd>
      </label>

      <div role="group" aria-label="表示形式" style="display: flex; align-items: center; gap: 2px; height: 36px; padding: 3px; box-sizing: border-box; border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.08)">
        <button type="button" aria-label="ジャスティファイ表示" aria-pressed="true" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 28px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.16); color: #FFFFFF; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="10" height="6" rx="1.5"></rect><rect x="15" y="5" width="6" height="6" rx="1.5"></rect><rect x="3" y="13" width="6" height="6" rx="1.5"></rect><rect x="11" y="13" width="10" height="6" rx="1.5"></rect></svg></button>
        <button type="button" aria-label="グリッド表示" aria-pressed="false" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></button>
        <button type="button" aria-label="リスト表示" aria-pressed="false" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #B4B4BC; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"></path></svg></button>
      </div>

      <button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.08); color: #E4E4E8; font: inherit; font-size: 13px; cursor: pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg>
        追加日
      </button>

      <div style="display: flex; align-items: center; gap: 2px; height: 36px; padding: 3px; box-sizing: border-box; border-radius: 18px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.08)">
        <button type="button" aria-label="フィルタ" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #D9D9DE; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
        <a href="Downloads.dc.html" aria-label="ダウンロード" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 28px; border-radius: 14px; color: #D9D9DE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></a>
      </div>

      <a href="Import.dc.html" aria-label="ファイルを取り込む" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 18px; background: {{accent}}; color: #1C0E07"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>

      <button type="button" aria-label="インスペクタを表示" aria-pressed="{{showInspector}}" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: #D9D9DE; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M15 5v14"></path></svg></button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 4px 8px 12px">
      <div role="group" aria-label="種類で絞り込む" style="display: flex; gap: 2px; padding: 2px; border-radius: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07)">
        <button type="button" aria-pressed="true" style="height: 26px; padding: 0 12px; border: 0; border-radius: 13px; background: rgba(255, 255, 255, 0.16); color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">すべて</button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: transparent; color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg>画像</button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: transparent; color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>動画</button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: transparent; color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg>音楽</button>
      </div>
      <button type="button" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"></path></svg>評価</button>
      <button type="button" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer">タグ<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer">長さ<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer">
        色
        <span aria-hidden="true" style="display: flex">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: #F2A65A; border: 1px solid #121214"></span>
          <span style="width: 10px; height: 10px; margin-left: -3px; border-radius: 50%; background: #6FB1FF; border: 1px solid #121214"></span>
          <span style="width: 10px; height: 10px; margin-left: -3px; border-radius: 50%; background: #C49BFF; border: 1px solid #121214"></span>
        </span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); color: #C9C9D0; font: inherit; font-size: 12px; cursor: pointer">取得元<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

      <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; color: #A3A3AC">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
        <input type="range" min="1" max="5" value="3" aria-label="サムネイルの大きさ" style="width: 110px; accent-color: {{accent}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect></svg>
      </label>
    </div>

    <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 8px; min-height: 0">

      <section aria-label="アイテム一覧" style="position: relative; flex: 999 1 480px; min-width: 0; padding: 0 8px 96px 12px; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="group" hint-placeholder-count="2">
          <div style="display: flex; align-items: baseline; gap: 8px; padding: 8px 2px 2px">
            <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #F4F4F6">{{group.label}}</h2>
            <span style="font-size: 12px; color: #A3A3AC">{{group.count}}</span>
          </div>
          <sc-for list="{{group.rows}}" as="row" hint-placeholder-count="2">
            <div style="display: flex; gap: 6px">
              <sc-for list="{{row.items}}" as="item" hint-placeholder-count="4">
                <button type="button" aria-label="{{item.title}}" aria-pressed="{{item.selected}}" onClick="{{item.pick}}" style="position: relative; flex: {{item.ar}} 1 0px; aspect-ratio: {{item.ar}}; min-width: 0; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: {{item.bg}}; cursor: pointer">
                  <span aria-hidden="true" style="position: absolute; left: {{item.cx}}%; top: {{item.cy}}%; width: {{item.r}}%; aspect-ratio: 1; border-radius: 50%; background: {{item.fg}}; transform: translate(-50%, -50%)"></span>
                  <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{item.bandH}}%; background: {{item.band}}"></span>
                  <sc-if value="{{item.isAudio}}" hint-placeholder-val="{{ false }}">
                    <svg viewBox="0 0 120 24" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 10px; bottom: 34px; width: calc(100% - 20px); height: 22%"><path d="M2 9v6M6 7v10M10 5v14M14 8v8M18 4v16M22 2v20M26 6v12M30 3v18M34 1v22M38 5v14M42 7v10M46 4v16M50 2v20M54 1v22M58 3v18M62 6v12M66 8v8M70 5v14M74 3v18M78 1v22M82 4v16M86 7v10M90 9v6M94 6v12M98 4v16M102 2v20M106 5v14M110 7v10M114 8v8M118 9v6" stroke="rgba(255,255,255,0.78)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>
                    <span style="position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.58); color: #FFFFFF; font-size: 11px; font-weight: 600"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="17.5" cy="16" r="2.5"></circle></svg>音楽</span>
                    <span style="position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.58); color: #FFFFFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">{{item.dur}}</span>
                  </sc-if>
                  <sc-if value="{{item.isVideo}}" hint-placeholder-val="{{ false }}">
                    <span style="position: absolute; right: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.58); color: #FFFFFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums"><svg width="8" height="8" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16l14-8z" fill="currentColor"></path></svg>{{item.dur}}</span>
                  </sc-if>
                  <sc-if value="{{item.fromWeb}}" hint-placeholder-val="{{ false }}">
                    <span style="position: absolute; left: 6px; top: 6px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>
                  </sc-if>
                  <sc-if value="{{item.isCapture}}" hint-placeholder-val="{{ false }}">
                    <span style="position: absolute; left: 6px; top: 6px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
                  </sc-if>
                  <sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
                    <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 2.5px {{accent}}, inset 0 0 0 5px rgba(18, 18, 20, 0.85)"></span>
                  </sc-if>
                </button>
              </sc-for>
            </div>
          </sc-for>
        </sc-for>

        <div style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 20px; background: rgba(44, 44, 50, 0.84); border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); overflow: hidden">
          <div aria-hidden="true" style="position: relative; flex: none; width: 40px; height: 40px; border-radius: 9px; overflow: hidden; background: #1E3A36">
            <span style="position: absolute; left: 72%; top: 30%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: #7ED8C3; transform: translate(-50%, -50%)"></span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">rain-loop.flac</span>
            <span style="font-size: 11px; color: #B4B4BC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">夜の作業 · 6 / 42 · 次は画像（8秒）</span>
          </div>
          <button type="button" aria-label="前へ" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: #E4E4E8; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L9 12z" fill="currentColor"></path></svg></button>
          <button type="button" aria-label="一時停止" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 18px; background: #F4F4F6; color: #121214; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></button>
          <button type="button" aria-label="次へ" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: #E4E4E8; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5v14l10-7z" fill="currentColor"></path></svg></button>
          <a href="Player.dc.html" aria-label="シアター表示で開く" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; color: #E4E4E8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></a>
          <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 38%; height: 2px; background: {{accent}}"></span>
        </div>
      </section>

      <sc-if value="{{showInspector}}" hint-placeholder-val="{{ true }}">
        <aside aria-label="インスペクタ" style="flex: 1 1 296px; max-width: 340px; min-width: 0; box-sizing: border-box; padding: 14px; border-radius: 16px; background: rgba(38, 38, 43, 0.86); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); display: flex; flex-direction: column; gap: 16px">

          <div style="display: flex; align-items: center; justify-content: center; height: 220px; border-radius: 10px; background: #0B0B0D; overflow: hidden">
            <div aria-hidden="true" style="position: relative; width: {{sel.pw}}; height: {{sel.ph}}; aspect-ratio: {{sel.ar}}; overflow: hidden; background: {{sel.bg}}">
              <span style="position: absolute; left: {{sel.cx}}%; top: {{sel.cy}}%; width: {{sel.r}}%; aspect-ratio: 1; border-radius: 50%; background: {{sel.fg}}; transform: translate(-50%, -50%)"></span>
              <span style="position: absolute; left: 0; right: 0; bottom: 0; height: {{sel.bandH}}%; background: {{sel.band}}"></span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 15px; font-weight: 600; line-height: 1.35; word-break: break-all">{{sel.title}}</div>
            <div style="font-size: 12px; color: #B4B4BC">{{sel.kindLabel}} · {{sel.meta}}</div>
            <div role="group" aria-label="評価" style="display: flex; gap: 2px; margin-top: 2px">
              <sc-for list="{{sel.stars}}" as="star" hint-placeholder-count="5">
